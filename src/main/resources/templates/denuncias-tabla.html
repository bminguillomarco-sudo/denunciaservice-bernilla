<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Denuncias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 rounded shadow-sm">
        <h2 class="mb-4 text-primary">Lista de Denuncias Registradas</h2>
        <table class="table table-bordered table-striped table-hover align-middle">
            <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>DNI</th>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Dirección</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${denuncias}">
                    <td th:text="${d.id}" class="text-center font-weight-bold"></td>
                    <td th:text="${d.dni}"></td>
                    <td th:text="${d.fecha}"></td>
                    <td th:text="${d.tipo}"></td>
                    <td th:text="${d.direccion}"></td>
                    <td th:text="${d.descripcion}"></td>
                    <td class="text-center">
                        <span th:if="${d.estado == 1}" class="badge bg-success">Activo</span>
                        <span th:unless="${d.estado == 1}" class="badge bg-danger">Inactivo</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
